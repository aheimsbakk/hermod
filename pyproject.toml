[project]
name = "hermod-p2p"
version = "0.3.0"
description = "Secure peer-to-peer file and text transfer with hybrid post-quantum cryptography"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "kyber-py>=1.2.0",
    "spake2>=0.9",
    "msgpack>=1.0.8",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
pq = ["liboqs-python>=0.10.0"]

[project.scripts]
hermod = "hermod.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/hermod"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
