# .github/workflows/release.yml — Build and publish Hermod on version tag push.
#
# Triggered by: push of a semver tag in the format vX.Y.Z (e.g. v0.11.0, v1.2.3).
#              Each of X, Y, Z supports 1–3 digits.
# Builds:       linux/amd64, linux/arm64, windows/amd64, windows/arm64, darwin/arm64
# Publishes:    GitHub Release with changelog entry as body + all binaries + checksums
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: hermod-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - windows-arm64
          - darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify version tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -qE '^v[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "ERROR: $TAG is not a valid version tag (expected vX.Y.Z, each 1–3 digits)" >&2
            exit 1
          fi
          echo "Version tag confirmed: $TAG"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          OS="${target%-*}"
          ARCH="${target#*-}"
          ./scripts/build-release.sh "$OS" "$ARCH"
        env:
          target: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hermod-${{ matrix.target }}
          path: dist/hermod-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write changelog entry to file
        run: |
          ./scripts/extract-changelog-entry.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          cd dist
          sha256sum hermod-* > "SHA256SUMS-${VERSION}"
          echo "--- Checksums (SHA256SUMS-${VERSION}) ---"
          cat "SHA256SUMS-${VERSION}"

      - name: Create GitHub Release
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Hermod ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            dist/hermod-* \
            "dist/SHA256SUMS-${VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
